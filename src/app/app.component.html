<header class="nav-bar">
  <a class="brand" routerLink="/" aria-label="MTGenesis.AI home">
    <img src="assets/site_logo.png" alt="" class="brand-logo" width="40" height="40">
    <h1 class="brand-name">MTGenesis<span class="brand-tld">.AI</span></h1>
  </a>

  <ng-container *ngIf="user$ | async as user">
    <nav class="nav-links" aria-label="Main">
      <a *ngFor="let link of navLinks"
         [routerLink]="link.path"
         routerLinkActive="active"
         ariaCurrentWhenActive="page">{{ link.label }}</a>
    </nav>

    <div class="nav-right">
      <app-queue-badge></app-queue-badge>
      <div class="nav-user">
        <span class="avatar" aria-hidden="true" [title]="user.username">{{ user.username.charAt(0) }}</span>
        <span class="username">{{ user.username }}</span>
        <button type="button" class="logout" (click)="logout()" title="Log out">
          <span class="material-icons" aria-hidden="true">logout</span>
          <span class="logout-label">Log out</span>
        </button>
      </div>
    </div>
  </ng-container>
</header>

<main class="page-outlet">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer">
  <img src="assets/site_logo.png" alt="" class="footer-logo" width="28" height="28">
  <p>&copy; 2025 MTGenesis.AI &middot; Create custom Magic: The Gathering cards</p>
  <nav class="footer-links" *ngIf="user$ | async" aria-label="More">
    <a routerLink="/events">Past events</a>
    <ng-container *ngIf="showHostTools">
      <span aria-hidden="true">&middot;</span>
      <a routerLink="/admin">Host tools</a>
    </ng-container>
  </nav>
</footer>

<!-- Phones: the main destinations live in a thumb-reach tab bar -->
<nav class="tab-bar" *ngIf="user$ | async" aria-label="Main">
  <a *ngFor="let link of navLinks"
     [routerLink]="link.path"
     routerLinkActive="active"
     ariaCurrentWhenActive="page">
    <span class="material-icons" aria-hidden="true">{{ link.icon }}</span>
    <span class="tab-label">{{ link.short }}</span>
  </a>
</nav>
