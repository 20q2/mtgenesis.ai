<form [formGroup]="cardForm" (ngSubmit)="onSubmit()" class="card-form">
  <!-- Name + mana cost: the card's header line -->
  <div class="form-row">
    <div class="field" *ngIf="showName">
      <label [for]="'name' + idSuffix" class="field-label">Card name</label>
      <input [id]="'name' + idSuffix"
             type="text"
             formControlName="name"
             placeholder="Enter card name"
             maxlength="30"
             autocomplete="off"
             class="night-input name-input"
             [class.invalid]="cardForm.get('name')?.invalid && cardForm.get('name')?.touched">
      <span class="field-error" *ngIf="cardForm.get('name')?.errors?.['maxlength'] && cardForm.get('name')?.touched">Card name must be 30 characters or less</span>
    </div>

    <div class="field">
      <label [for]="'manaCost' + idSuffix" class="field-label">{{ commanderMode ? 'Colored pips' : 'Mana cost' }}</label>
      <input [id]="'manaCost' + idSuffix"
             type="text"
             formControlName="manaCost"
             [placeholder]="commanderMode ? '{W}{U}' : '{1}{W}{U} or {X}'"
             autocomplete="off"
             spellcheck="false"
             class="night-input mana-input"
             (input)="onManaCostChange()"
             (blur)="reorderManaCost()">
      <div class="mana-symbols" role="group" aria-label="Add mana symbols">
        <button type="button"
                *ngFor="let symbol of manaSymbols"
                class="pip-btn"
                (click)="insertManaSymbol(symbol.symbol)"
                [title]="symbol.description"
                [attr.aria-label]="'Add ' + symbol.description">
          <i class="ms ms-{{getSymbolClass(symbol.symbol)}} ms-cost" aria-hidden="true"></i>
        </button>
        <button type="button" class="chip clear-btn" (click)="clearManaCost()">
          <span class="material-icons" aria-hidden="true">backspace</span>
          Clear
        </button>
      </div>
      <span class="muted commander-cost-hint" *ngIf="commanderMode">
        Generic mana is added up to {{ commanderCmc }} mana.
      </span>
    </div>
  </div>

  <!-- Commander: Legendary Creature or Legendary Artifact — Vehicle -->
  <div class="field" *ngIf="commanderMode">
    <span class="field-label" [id]="'kind-label' + idSuffix">Commander</span>
    <div class="chips" role="group" [attr.aria-labelledby]="'kind-label' + idSuffix">
      <button type="button" class="chip kind-creature"
              [attr.aria-pressed]="commanderKind === 'creature'"
              (click)="setCommanderKind('creature')">
        <i class="ms ms-creature" aria-hidden="true"></i> Creature
      </button>
      <button type="button" class="chip kind-vehicle"
              [attr.aria-pressed]="commanderKind === 'vehicle'"
              (click)="setCommanderKind('vehicle')">
        <i class="ms ms-artifact" aria-hidden="true"></i> Vehicle
      </button>
    </div>
  </div>

  <!-- Type line (fixed for a commander set) -->
  <div class="field" *ngIf="!commanderMode">
    <label [for]="'supertype' + idSuffix" class="field-label">Supertype <span class="optional">optional</span></label>
    <input [id]="'supertype' + idSuffix"
           type="text"
           formControlName="supertype"
           placeholder="Legendary, Basic, Snow, etc."
           autocomplete="off"
           class="night-input">
    <div class="chips">
      <button type="button"
              *ngFor="let supertype of supertypeOptions"
              class="chip"
              [attr.aria-pressed]="isSelected('supertype', supertype.value)"
              (click)="selectSupertype(supertype.value)">
        {{ supertype.label }}
      </button>
    </div>
  </div>

  <div class="field" *ngIf="!commanderMode">
    <label [for]="'type' + idSuffix" class="field-label">Card type</label>
    <input [id]="'type' + idSuffix"
           type="text"
           formControlName="type"
           placeholder="Creature, Instant, Sorcery, etc."
           maxlength="50"
           autocomplete="off"
           class="night-input"
           [class.invalid]="cardForm.get('type')?.invalid && cardForm.get('type')?.touched">
    <span class="field-error" *ngIf="cardForm.get('type')?.errors?.['maxlength'] && cardForm.get('type')?.touched">Card type must be 50 characters or less</span>
    <div class="chips">
      <button type="button"
              *ngFor="let type of cardTypeOptions"
              class="chip"
              [attr.aria-pressed]="isSelected('type', type.value)"
              (click)="selectCardType(type.value)">
        <i *ngFor="let icon of type.icons" class="ms {{ icon }}" aria-hidden="true"></i>
        {{ type.label }}
      </button>
    </div>
  </div>

  <div class="form-row">
    <div class="field" *ngIf="filteredSubtypes.length > 0">
      <label [for]="'subtype' + idSuffix" class="field-label">Subtype</label>
      <input [id]="'subtype' + idSuffix"
             type="text"
             formControlName="subtype"
             placeholder="Human, Wizard, Equipment, etc."
             autocomplete="off"
             class="night-input">
      <div class="chips">
        <button type="button"
                *ngFor="let subtype of filteredSubtypes"
                class="chip chip-sm"
                [attr.aria-pressed]="isSelected('subtype', subtype)"
                (click)="selectSubtype(subtype)">
          {{ subtype }}
        </button>
      </div>
    </div>

    <div class="field pt-field" *ngIf="showPowerToughness">
      <label [for]="'powerToughness' + idSuffix" class="field-label">Power / toughness</label>
      <input [id]="'powerToughness' + idSuffix"
             type="text"
             formControlName="powerToughness"
             placeholder="2/3 or */X"
             autocomplete="off"
             class="night-input pt-input"
             [class.invalid]="isFieldInvalid('power') || isFieldInvalid('toughness')"
             (input)="onPowerToughnessChange()">
    </div>

    <!-- Commander: point-buy P/T, optional -->
    <div class="field pt-field" *ngIf="commanderMode">
      <label [for]="'commanderPt' + idSuffix" class="field-label">Power / toughness <span class="optional">optional</span></label>
      <input [id]="'commanderPt' + idSuffix"
             type="text"
             formControlName="powerToughness"
             placeholder="auto"
             autocomplete="off"
             inputmode="numeric"
             class="night-input pt-input"
             [class.invalid]="!!statsError"
             [attr.aria-describedby]="(statsError ? 'commanderPtError' : 'commanderPtHint') + idSuffix">
      <span *ngIf="statsError as err; else ptHint" [id]="'commanderPtError' + idSuffix" class="field-error pt-error">{{ err }}</span>
      <ng-template #ptHint><span [id]="'commanderPtHint' + idSuffix" class="muted pt-hint">{{ statsHint }}</span></ng-template>
    </div>
  </div>

  <!-- Rarity -->
  <div class="field">
    <span class="field-label" [id]="'rarity-label' + idSuffix">Rarity</span>
    <div class="rarity-group" [class.rarity-group-3]="commanderMode" role="radiogroup" [attr.aria-labelledby]="'rarity-label' + idSuffix">
      <label *ngFor="let rarity of visibleRarities"
             class="rarity-option rarity-{{ rarity.value.toLowerCase() }}"
             [class.taken]="rarityTakenAt(rarity.value) !== undefined">
        <input type="radio" class="sr-only" formControlName="rarity" [value]="rarity.value"
               [attr.disabled]="rarityTakenAt(rarity.value) !== undefined ? '' : null">
        <span class="gem" aria-hidden="true"></span>
        {{ rarity.label }}
        <span *ngIf="rarityTakenAt(rarity.value) as cmc" class="taken-note">used at {{ cmc }} CMC</span>
      </label>
    </div>
  </div>

  <!-- Actions -->
  <div class="form-actions" [class.sticky-actions]="showGenerate">
    <span class="generation-time-note" *ngIf="lastGenerationTime !== null">
      Last card took {{ lastGenerationTime.toFixed(1) }}s
    </span>
    <div class="action-buttons">
      <button type="button" class="btn btn-ghost clear-form-btn" (click)="clearForm()" [disabled]="isGenerating">
        <span class="material-icons" aria-hidden="true">restart_alt</span>
        Clear form
      </button>
      <button type="button"
              class="btn btn-ghost regenerate-text-btn"
              (click)="onRegenerateText()"
              [disabled]="isGenerating"
              *ngIf="shouldShowRegenerateButton()">
        <span class="material-icons" aria-hidden="true">refresh</span>
        Regenerate text
      </button>
      <button *ngIf="showGenerate" type="submit" class="btn btn-gold generate-btn" [disabled]="isGenerating || !modelsReady">
        <ng-container *ngIf="isGenerating; else idleLabel">
          <mat-spinner diameter="18" aria-hidden="true"></mat-spinner>
          Generating…
        </ng-container>
        <ng-template #idleLabel>
          <span class="material-icons" aria-hidden="true">{{ modelsReady ? 'auto_awesome' : 'cloud_off' }}</span>
          {{ modelsReady ? 'Generate card' : 'Server offline' }}
        </ng-template>
      </button>
    </div>
  </div>
</form>
