<article class="set-row panel">
  <header class="set-row-header">
    <span *ngIf="set.cmc" class="row-cmc" [attr.aria-label]="set.cmc + ' CMC'">
      <i class="ms ms-cost ms-shadow ms-{{ set.cmc }}" aria-hidden="true"></i>
    </span>
    <h3 class="commander">{{ set.commanderName }}</h3>
    <span *ngIf="set.cmc" class="row-meta rarity-{{ set.rarity }}">
      {{ set.cmc }} CMC<ng-container *ngIf="rarityLabel"> · <span class="gem" aria-hidden="true"></span>{{ rarityLabel }}</ng-container>
    </span>
    <span class="by muted">by {{ set.username }}</span>
  </header>

  <p class="swipe-hint muted"><span class="material-icons" aria-hidden="true">swipe</span> Swipe to compare all 3 versions</p>
  <div class="cards">
    <div *ngFor="let card of set.cards; trackBy: trackCard"
         class="vote-card"
         [attr.data-card-id]="card.id"
         [class.mine]="isMine(card)"
         [class.leader]="card.leader"
         [class.tied]="card.tied">
      <div class="flags">
        <span *ngIf="card.leader" class="flag flag-leader">
          <span class="material-icons" aria-hidden="true">workspace_premium</span> {{ final ? 'Winner' : 'Leading' }}
        </span>
        <span *ngIf="card.tied" class="flag flag-tied">Tied</span>
        <span *ngIf="isMine(card)" class="flag flag-mine">Your pick</span>
      </div>

      <app-card-slot [view]="card" [showReroll]="false" [label]="'Version ' + card.slot"></app-card-slot>

      <div class="vote-bar">
        <span class="count">{{ card.votes }} {{ card.votes === 1 ? 'vote' : 'votes' }}</span>
        <span *ngIf="card.ownerVote" class="owner-x2 muted" title="The owner's own vote counts as two">owner ×2</span>
        <button *ngIf="showVoteButtons"
                type="button"
                class="btn vote-button"
                [class.btn-gold]="isMine(card)"
                [class.btn-ghost]="!isMine(card)"
                [disabled]="disabled"
                (click)="onVote(card)">
          <span class="material-icons">{{ isMine(card) ? 'how_to_vote' : 'thumb_up' }}</span>
          {{ isMine(card) ? 'Voted' : 'Vote' }}
        </button>
      </div>
    </div>
  </div>
</article>
