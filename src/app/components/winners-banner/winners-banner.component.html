<section class="winners-banner">
  <h3 class="winners-title"><span class="material-icons" aria-hidden="true">emoji_events</span> {{ title }}</h3>
  <p *ngIf="!sets.length" class="muted">No commanders were locked in.</p>
  <div *ngFor="let group of sets | cmcGroups; trackBy: trackGroup" class="winners-group">
    <h4 class="cmc-heading">{{ group.label }}</h4>
    <ul class="winners-list">
      <li *ngFor="let set of group.sets; trackBy: trackSet" class="winner-item" [ngClass]="'outcome-' + outcome(set).kind">
        <div class="thumbs">
          <img *ngFor="let card of outcome(set).cards"
               [src]="card.cardImageUrl | media | async"
               [alt]="set.commanderName + ' version ' + card.slot">
        </div>
        <div class="winner-text">
          <strong class="winner-name">{{ set.commanderName }}</strong>
          <span class="muted"> by {{ set.username }}</span>
          <div class="winner-version">{{ label(outcome(set)) }}</div>
        </div>
      </li>
    </ul>
  </div>
</section>
